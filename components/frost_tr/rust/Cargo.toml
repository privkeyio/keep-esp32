[package]
name = "frost_tr"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "FROST(secp256k1, SHA-256, Taproot) for keep-esp32, wrapping the Zcash Foundation crate behind a C interface"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
frost-secp256k1-tr = { version = "=3.0.0", default-features = false, features = ["serialization"] }
frost-core = { version = "=3.0.0", default-features = false, features = ["serialization"] }
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "schnorr"] }
rand_core = { version = "=0.6.4", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }
base64ct = { version = "=1.8.3", default-features = false, features = ["alloc"] }
blake2 = { version = "=0.10.6", default-features = false }
chacha20 = { version = "=0.9.1", default-features = false }
hkdf = { version = "=0.12.4", default-features = false }
hmac = { version = "=0.12.1", default-features = false }

[dev-dependencies]
serde_json = "=1.0.145"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"

[profile.dev]
panic = "abort"
