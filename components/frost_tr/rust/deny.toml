# cargo-deny policy for frost_tr: no known-vulnerable crates, permissive
# licenses only, and crates.io as the only source.

[advisories]
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is unmaintained (not a vulnerability); reached only through frost-core -> postcard 1.1.3 -> heapless 0.7, the serialization chain the keep host also ships, and no postcard release drops it" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
