name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: keep-esp32

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: privkeyio/secp256k1-frost
          # Pinned by commit, not branch: a branch ref means anyone with push
          # access silently changes what CI builds and what we release.
          ref: 746dbbea5c34dde963c9bd55bc7474b2d50fa597
          path: secp256k1-frost

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: privkeyio/libnostr-c
          ref: 361a4917d8179370bbd2ffcf6dcfa573de4fb97d # v0.2.1
          path: libnostr-c

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: privkeyio/noscrypt
          ref: 45fcbef32f958145d6797f384a225c0d43616886
          path: noscrypt

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ElementsProject/libwally-core
          ref: 0c41f38fb1c201786e9c3ac9eae4f5f80c051399 # release_1.5.6
          path: libwally-core

      - name: Build ESP32-S3 firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1.2.0
        with:
          esp_idf_version: v5.4.4
          target: esp32s3
          path: keep-esp32

      - name: Install esptool
        run: pip install esptool

      - name: Package release
        run: |
          mkdir -p release
          sudo cp keep-esp32/build/keep.bin release/
          sudo cp keep-esp32/build/bootloader/bootloader.bin release/
          sudo cp keep-esp32/build/partition_table/partition-table.bin release/
          sudo cp keep-esp32/build/ota_data_initial.bin release/
          sudo cp keep-esp32/build/flash_args release/
          cp keep-esp32/README.md release/
          sudo chown -R $(id -u):$(id -g) release/
          cd release
          esptool --chip esp32s3 merge-bin \
            --flash-mode dio \
            --flash-freq 80m \
            --flash-size 8MB \
            -o keep-merged.bin \
            0x0 bootloader.bin \
            0x8000 partition-table.bin \
            0xd000 ota_data_initial.bin \
            0x10000 keep.bin
          tar -czvf ../keep-esp32-firmware-${{ github.ref_name }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keep-esp32-firmware
          path: keep-esp32-firmware-*.tar.gz

      - name: Prepare Pages content
        run: |
          mkdir -p pages
          cp keep-esp32/docs/index.html pages/
          jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' keep-esp32/docs/manifest.json > pages/manifest.json
          cp release/keep-merged.bin pages/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Web Flasher (Easiest)

            Flash directly from your browser - no tools required:

            **[Open Web Flasher](https://privkeyio.github.io/keep-esp32/)**

            ## Manual Flashing

            ### Quick Flash (Merged Binary)
            Flash the merged binary directly at address 0x0:
            ```bash
            esptool.py --chip esp32s3 --port /dev/ttyACM0 write_flash 0x0 keep-merged.bin
            ```

            ### Individual Binaries
            Or flash each binary separately:
            ```bash
            esptool.py --chip esp32s3 --port /dev/ttyACM0 write_flash \
              --flash-mode dio --flash-freq 80m --flash-size 8MB \
              0x0 bootloader.bin \
              0x8000 partition-table.bin \
              0xd000 ota_data_initial.bin \
              0x10000 keep.bin
            ```

            Replace `/dev/ttyACM0` with your device's serial port (e.g., `COM3` on Windows, `/dev/cu.usbmodem*` on macOS).
