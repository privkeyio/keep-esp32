name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: keep-esp32

      - uses: actions/checkout@v4
        with:
          repository: privkeyio/secp256k1-frost
          ref: esp-idf-support
          path: secp256k1-frost

      - uses: actions/checkout@v4
        with:
          repository: privkeyio/libnostr-c
          ref: v0.1.2
          path: libnostr-c

      - uses: actions/checkout@v4
        with:
          repository: privkeyio/noscrypt
          ref: esp-idf-support
          path: noscrypt

      - uses: actions/checkout@v4
        with:
          repository: ElementsProject/libwally-core
          ref: release_1.5.1
          path: libwally-core

      - name: Build ESP32-S3 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32s3
          path: keep-esp32

      - name: Install esptool
        run: pip install esptool

      - name: Package release
        run: |
          mkdir -p release
          cp keep-esp32/build/keep.bin release/
          cp keep-esp32/build/bootloader/bootloader.bin release/
          cp keep-esp32/build/partition_table/partition-table.bin release/
          cp keep-esp32/build/ota_data_initial.bin release/
          cp keep-esp32/build/flash_args release/
          cp keep-esp32/README.md release/
          cd release
          esptool --chip esp32s3 merge-bin \
            --flash-mode dio \
            --flash-freq 80m \
            --flash-size 8MB \
            -o keep-merged.bin \
            0x0 bootloader.bin \
            0x8000 partition-table.bin \
            0xd000 ota_data_initial.bin \
            0x10000 keep.bin
          tar -czvf ../keep-esp32-firmware-${{ github.ref_name }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keep-esp32-firmware
          path: keep-esp32-firmware-*.tar.gz

      - name: Prepare Pages content
        run: |
          mkdir -p pages
          cp keep-esp32/docs/index.html pages/
          sed 's/"version": "[^"]*"/"version": "${{ github.ref_name }}"/' keep-esp32/docs/manifest.json > pages/manifest.json
          cp release/keep-merged.bin pages/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Web Flasher (Easiest)

            Flash directly from your browser - no tools required:

            **[Open Web Flasher](https://privkeyio.github.io/keep-esp32/)**

            ## Manual Flashing

            ### Quick Flash (Merged Binary)
            Flash the merged binary directly at address 0x0:
            ```bash
            esptool.py --chip esp32s3 --port /dev/ttyACM0 write_flash 0x0 keep-merged.bin
            ```

            ### Individual Binaries
            Or flash each binary separately:
            ```bash
            esptool.py --chip esp32s3 --port /dev/ttyACM0 write_flash \
              --flash-mode dio --flash-freq 80m --flash-size 8MB \
              0x0 bootloader.bin \
              0x8000 partition-table.bin \
              0xd000 ota_data_initial.bin \
              0x10000 keep.bin
            ```

            Replace `/dev/ttyACM0` with your device's serial port (e.g., `COM3` on Windows, `/dev/tty.usbserial-*` on macOS).
