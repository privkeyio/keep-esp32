name: CI

# No job here uses GITHUB_TOKEN: the checkouts are public and nothing calls the
# API, so a read-only token is all any of them needs. Set at workflow level so a
# new job cannot inherit the repository default by omission.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: keep-esp32
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: privkeyio/secp256k1-frost
          # Pinned by commit, not branch: a branch ref means anyone with push
          # access silently changes what CI builds and what we release.
          ref: 746dbbea5c34dde963c9bd55bc7474b2d50fa597
          path: secp256k1-frost

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: privkeyio/libnostr-c
          ref: e07af71f39953ce31cf19c358c4ba2a7e7025800 # v0.2.2
          path: libnostr-c

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: privkeyio/noscrypt
          ref: 02e47e81eb9338d8cb9ae84a14a3992f00f4a651
          path: noscrypt

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ElementsProject/libwally-core
          ref: 0c41f38fb1c201786e9c3ac9eae4f5f80c051399 # release_1.5.6
          path: libwally-core

      - name: Record the component lock hash before building
        id: lockhash
        working-directory: keep-esp32
        run: |
          cp dependencies.lock "$RUNNER_TEMP/dependencies.lock.before"
          echo "sha=$(sha256sum dependencies.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # components/frost_tr is Rust, built for the ESP32-S3 in the pinned
      # Espressif toolchain image (the digest lives in the script) before the
      # IDF build links it.
      - name: Build frost_tr
        working-directory: keep-esp32
        run: scripts/build-frost-tr.sh --docker

      - uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1.2.0
        with:
          esp_idf_version: v5.4.4
          target: esp32s3
          path: keep-esp32

      # dependencies.lock is tracked so the managed-component set is pinned, but
      # main/idf_component.yml uses caret ranges. The component manager happily
      # re-resolves within those ranges and rewrites the lock mid-build, which
      # would otherwise ship a different transitive set than the one committed
      # and leave no signal that it happened.
      #
      # Compared by hash rather than `git diff`: the IDF action builds in a
      # container as root, so the checkout can end up owned by another uid and
      # git would abort with "dubious ownership" instead of comparing.
      - name: Fail if the build re-resolved the component lock
        working-directory: keep-esp32
        env:
          BEFORE: ${{ steps.lockhash.outputs.sha }}
        run: |
          after=$(sha256sum dependencies.lock | cut -d' ' -f1)
          if [ "$after" != "$BEFORE" ]; then
            echo "::error::dependencies.lock was rewritten by the build; the committed component set is not what was built." >&2
            echo "  before: $BEFORE" >&2
            echo "  after:  $after" >&2
            diff -u "$RUNNER_TEMP/dependencies.lock.before" dependencies.lock >&2 || true
            echo "Commit the updated lock deliberately, or tighten the ranges in main/idf_component.yml." >&2
            exit 1
          fi
          echo "dependencies.lock unchanged ($after): built the committed component set."

  frost-tr-deny:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: components/frost_tr/rust/Cargo.toml
          arguments: ""

  native-tests:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: keep-esp32
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: privkeyio/secp256k1-frost
          # Pinned by commit, not branch: a branch ref means anyone with push
          # access silently changes what CI builds and what we release.
          ref: 746dbbea5c34dde963c9bd55bc7474b2d50fa597
          path: secp256k1-frost

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ElementsProject/libwally-core
          ref: 0c41f38fb1c201786e9c3ac9eae4f5f80c051399 # release_1.5.6
          path: libwally-core
          submodules: recursive

      # The UI tests render the firmware's screens with the LVGL release that
      # dependencies.lock pins (lvgl/lvgl 9.5.0), placed where an IDF build puts it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lvgl/lvgl
          ref: 85aa60d18b3d5e5588d7b247abf90198f07c8a63 # v9.5.0
          path: keep-esp32/managed_components/lvgl__lvgl

      - name: Build secp256k1-frost
        run: |
          cd secp256k1-frost
          mkdir build && cd build
          cmake .. -DSECP256K1_ENABLE_MODULE_SCHNORRSIG=ON -DSECP256K1_ENABLE_MODULE_EXTRAKEYS=ON -DSECP256K1_EXPERIMENTAL=ON
          make -j$(nproc)

      - name: Build libwally-core
        run: |
          sudo apt-get update && sudo apt-get install -y autoconf automake libtool libmbedtls-dev
          cd libwally-core
          ./tools/autogen.sh
          ./configure --disable-elements --disable-tests
          make -j$(nproc)

      - name: Install cJSON for the native tests
        # cJSON normally comes from managed_components/, which the IDF component
        # manager generates and .gitignore excludes. This job never runs an IDF
        # build, so that directory does not exist here and every cJSON-gated test
        # configured itself away silently.
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev

      - name: frost_tr host tests and vectors
        working-directory: keep-esp32
        run: |
          python3 scripts/gen-frost-tr-vectors.py --check
          scripts/build-frost-tr.sh --docker --test

      # The device harness links frost_tr built for the runner; frost_tool, the host
      # side of a FROST round, is built by the native CMake with the runner's cargo.
      - name: Build frost_tr for the native tests
        working-directory: keep-esp32
        run: scripts/build-frost-tr.sh --docker --host

      - name: Run native tests
        timeout-minutes: 15
        env:
          UI_SHOT_DIR: ${{ github.workspace }}/ui-screens
        run: |
          mkdir -p "$UI_SHOT_DIR"
          cd keep-esp32/test/native
          mkdir -p build && cd build
          # REQUIRE_ALL_TESTS turns a missing optional dependency into a configure
          # error. Without it a dependency that quietly disappears takes its tests
          # with it and the job still reports success.
          cmake .. -DREQUIRE_ALL_TESTS=ON
          make
          # Run everything that was built, rather than a hand-maintained list.
          # The list had drifted: 14 binaries were compiled and 5 were executed,
          # and three of the names in it did not exist, guarded by `[ ! -f ]` so
          # their absence read as success.
          failed=""
          for t in ./test_*; do
            [ -f "$t" ] && [ -x "$t" ] || continue
            echo "== $t"
            "$t" || failed="$failed $t"
          done
          if [ -n "$failed" ]; then
            echo "::error::failing native tests:$failed"
            exit 1
          fi
          echo "All native tests passed."

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screens
          path: ui-screens
          if-no-files-found: error

      - name: Run the device end-to-end signing tests
        timeout-minutes: 5
        # Two processes of the firmware's own request handlers (test/native/device)
        # signing as a 2-of-3 group over JSON-RPC, checked with BIP340.
        run: python3 keep-esp32/test/native/device/e2e.py keep-esp32/test/native/build

  docs:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Upload docs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: docs/html
