name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
        with:
          path: keep-esp32

      - uses: actions/checkout@v4
        with:
          repository: privkeyio/secp256k1-frost
          ref: esp-idf-support
          path: secp256k1-frost

      - uses: actions/checkout@v4
        with:
          repository: privkeyio/libnostr-c
          ref: v0.1.5
          path: libnostr-c

      - uses: actions/checkout@v4
        with:
          repository: privkeyio/noscrypt
          ref: esp-idf-support
          path: noscrypt

      - uses: actions/checkout@v4
        with:
          repository: ElementsProject/libwally-core
          ref: release_1.5.1
          path: libwally-core

      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32s3
          path: keep-esp32

  native-tests:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
        with:
          path: keep-esp32

      - uses: actions/checkout@v4
        with:
          repository: privkeyio/secp256k1-frost
          ref: esp-idf-support
          path: secp256k1-frost

      - uses: actions/checkout@v4
        with:
          repository: ElementsProject/libwally-core
          ref: release_1.5.1
          path: libwally-core

      - name: Build secp256k1-frost
        run: |
          cd secp256k1-frost
          mkdir build && cd build
          cmake .. -DSECP256K1_ENABLE_MODULE_SCHNORRSIG=ON -DSECP256K1_ENABLE_MODULE_EXTRAKEYS=ON -DSECP256K1_ENABLE_MODULE_FROST=ON -DSECP256K1_EXPERIMENTAL=ON
          make -j$(nproc)

      - name: Build libwally-core
        run: |
          sudo apt-get update && sudo apt-get install -y autoconf automake libtool
          cd libwally-core
          ./tools/autogen.sh
          ./configure --disable-elements --disable-tests
          make -j$(nproc)

      - name: Run native tests
        run: |
          cd keep-esp32/test/native
          mkdir -p build && cd build
          cmake ..
          make
          ./test_frost
          ./test_frost_signer_core
          ./test_session
          ./test_storage
          ./test_secure_element
          [ ! -f ./test_protocol ] || ./test_protocol
          [ ! -f ./test_psbt_fraud_integration ] || ./test_psbt_fraud_integration

  docs:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/html
